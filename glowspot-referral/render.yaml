# Render blueprint: free web service + Supabase (PostgreSQL) for the data. No paid disk needed.
services:
  - type: web
    name: glowspot-referral
    runtime: python
    plan: free
    rootDir: glowspot-referral
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_NAME
        value: Shop Manager
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Demo data and test banners are intentionally disabled in production.
