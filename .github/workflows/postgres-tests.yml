name: PostgreSQL migration tests

on:
  push:
    branches:
      - feature/supabase-postgres-migration
  pull_request:
    branches:
      - main

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: glowspot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glowspot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: glowspot-referral
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glowspot_test
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: glowspot-referral/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run application and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
